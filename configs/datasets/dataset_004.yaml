dataset:
  id: dataset_004
  name: synthetic_click_augmentation_5000
  description: Human demonstrations with 5000 synthetic clicks.

source:
  experiment_id: EXP001
  config_hash: "0f09cf723ef3ec12b6ffec3dc7d976534a665d26b27736c37d46d19c960d66f7"
  outcomes:
    - success
    - failed
    - aborted

preprocessing:
  observation_representation: augmented_spatial
  action_representation: displacement
  resampling_method: event_aggregation
  target_sampling_hz: 60
  normalize_observations: true

split:
  train_ratio: 0.8
  random_seed: 42
  reuse_from: dataset_002

augmentation:
  enabled: true
  strategy: synthetic_click
  num_samples: 5000
  random_seed: 42
  target_radius_range: [10, 40]
  cursor_distribution: uniform_disc
  apply_to: train